<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 교체 알고리즘 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>페이지 교체 알고리즘 시뮬레이터</h1>
            <p>프레임 수와 참조 순서를 입력하여 각 시점별 메모리 변화와 Page Fault를 확인하세요.</p>
        </header>

        <!-- 입력 영역 -->
        <section class="card input-section">
            <div class="form-group">
                <label for="frameCount">최대 프레임 수 (1~7)</label>
                <input type="number" id="frameCount" min="1" max="7" value="3">
            </div>

            <div class="form-group">
                <label for="refSequence">페이지 참조 순서 (쉼표 또는 공백으로 구분)</label>
                <input type="text" id="refSequence" value="7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1">
            </div>

            <div class="form-group">
                <label for="algorithm">알고리즘 선택</label>
                <select id="algorithm">
                    <option value="FIFO">FIFO (First-In First-Out)</option>
                    <option value="LRU">LRU (Least Recently Used)</option>
                    <option value="OPT">OPT (Optimal)</option>
                    <option value="LFU">LFU (Least Frequently Used)</option>
                </select>
            </div>

            <button id="calcBtn" class="btn">시뮬레이션 실행</button>
        </section>

        <!-- 요약 결과 영역 -->
        <section class="card summary-section">
            <div class="metric-card">
                <span class="metric-title">총 참조 횟수</span>
                <span id="totalRefs" class="metric-value">0</span>
            </div>
            <div class="metric-card danger">
                <span class="metric-title">Page Faults</span>
                <span id="pageFaults" class="metric-value">0</span>
            </div>
            <div class="metric-card success">
                <span class="metric-title">Hit Rate</span>
                <span id="hitRate" class="metric-value">0%</span>
            </div>
            <div class="metric-card warning">
                <span class="metric-title">Fault Rate</span>
                <span id="faultRate" class="metric-value">0%</span>
            </div>
        </section>

        <!-- 시각화 테이블 영역 -->
        <section class="card table-section">
            <h2>단계별 메모리 상태</h2>
            <div class="table-wrapper">
                <table id="resultTable">
                    <!-- JavaScript에서 동적으로 생성됩니다 -->
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
